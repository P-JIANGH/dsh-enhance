# dsh-enhance bundle patch: one install row.
#
# Mounts the dsh-enhance plugin for any profile that includes this bundle. The
# plugin contributes packaged skills, the work-rules prompt section, the
# session-start orientation hook, the doctor tool, work-tracking (boulder/goal)
# tools, and the advisor companion-review runtime.
# Note: the 5 agent personas (planner | reviewer | scout | librarian | task)
# under prompts/agents/ are NOT mounted here, because dsh-base / dsh-web-app
# already provide the @deepseek-ai/dsh-agent-presets service — mounting it
# again would double-register the `agentPresets` service and crash the loader
# ("service agentPresets has been registered").
#
# `name` MUST be the full package name, matching the upstream convention
# (base/web-app patches reference '@deepseek-ai/dsh-*'). The Cordis loader
# resolves this as a module specifier from the profile directory, so a bare
# `dsh-enhance` would fail with ERR_MODULE_NOT_FOUND unless the profile also
# carried an extra alias dependency. The row `id` stays short — ids are what
# user patches target, names are what the loader imports.
- insert:
    - id: dsh-enhance
      name: '@dsh-enhance/dsh-enhance'
