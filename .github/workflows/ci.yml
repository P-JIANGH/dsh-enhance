# CI：安装（含 prepare 构建）+ 类型检查 + 单测 + 发布载荷形状。
#
# 只跑 windows-latest 是**刻意的、诚实的**选择：测试套件里仍有平台假设
# （qa/dsh-launch 的桌面版 shim 识别与 where.exe、若干 Windows 路径用法），
# 在 Linux 上会红。改成跨平台是一个已知的 v2 项，见 docs/known-issues.md。
# 真机验收（qa:pack）不在这里跑：它需要一个真实的 dsh 宿主，而 CI 里没有。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `prepare` 会跑 tsc，所以这一步同时验证了构建。
      - name: Install (builds through prepare)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 换行符回归：把打包技能改写为 CRLF 再跑一次单测。CI 自身可能检出 LF（我们给了
      # `skills/** text eol=lf`），那样就再也压不到这条路径；而用户在 Windows 上以
      # core.autocrlf=true 检出（`github:` 安装就是这条路）拿到的正是 CRLF——曾导致
      # list() 静默返回空、插件一条技能都不贡献。
      - name: CRLF skill tree regression
        shell: pwsh
        run: |
          Get-ChildItem skills -Recurse -Filter SKILL.md | ForEach-Object {
            $t = [System.IO.File]::ReadAllText($_.FullName)
            [System.IO.File]::WriteAllText($_.FullName, $t.Replace("`r`n", "`n").Replace("`n", "`r`n"))
          }
          node --test tests/unit.test.mjs

      - name: Packed payload shape
        run: node scripts/check-pack-payload.mjs

      # 构建与测试不得在工作树里留下未入库的文件。这条专抓一类陷阱：测试引用了
      # 一个未被 git 跟踪的模块（例如被过宽的 .gitignore 规则忽略掉的 scripts/lib/），
      # 本地因为文件就在那儿而全绿，新 clone 上必红。只看未跟踪项，避免换行符差异噪声。
      - name: No untracked leftovers
        shell: pwsh
        run: |
          $untracked = git status --porcelain | Where-Object { $_ -match '^\?\?' }
          if ($untracked) {
            Write-Host $untracked
            throw "build/test left untracked files in the working tree"
          }
