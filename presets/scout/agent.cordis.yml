# Scout preset: Read-only exploration agent (persona single-source: prompts/agents/scout.persona.md)

- id: oh-my-dsh
  name: oh-my-dsh
  config:
    orientOnSessionStart: true
    doctorTool: true

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是只读探索智能体（scout）。快速摸清仓库结构与约定，输出带文件路径的事实清单（每文件的职责、关键模式），以压缩上下文形式交接给调用方。不做修改、不写代码、不执行有副作用的操作。
