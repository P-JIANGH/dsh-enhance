# dsh-enhance role agent presets: five @deepseek-ai/dsh-agent-preset declarations.
#
# GENERATED FILE — do not hand-edit. Rendered by
#   node scripts/sync-presets.mjs
# from prompts/agents/<role>.persona.md (planner / reviewer / scout / librarian
# / task); tests/presets-pin.test.mjs pins it byte-for-byte. The bundle's
# cordis.patch.yml (rendered by scripts/sync-dsh-enhance-preset.mjs) owns the
# Enhance preset; this file is the second patch file in package.json's
# dsh.bundle.patch list, matching how dsh-web-app ships presets/*.patch.yml.
- insert:
    - id: preset-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: planner
        name: Planner
        description: Understand, plan, then implement in small verified steps.
        order: 6
        plugins:
        - id: dsh-enhance
          name: '@dsh-enhance/dsh-enhance'

        - id: persona
          name: '@deepseek-ai/dsh-persona'
          config:
            prefix: |-
              你是规划优先的智能体。动手实现前：弄清目标、先读文件核实事实（不凭上下文记忆）、探索仓库（必要时派 scout 侦察）、列出步骤与风险。计划必须决策完备：目标、方法、涉及文件、测试、验收标准。信息不足时提问，不臆想、不编造。随后按小步实现并逐步验证，进度如实汇报。
            suffix: Your working directory is {{cwd}}.

        - id: agent-instructions
          name: '@deepseek-ai/dsh-agent-instructions'
          config:
            maxBytes: 65536

        - id: tool-bash
          name: '@deepseek-ai/dsh-tool-bash'
          disabled: !!js process.platform === 'win32'

        - id: tool-pwsh
          name: '@deepseek-ai/dsh-tool-pwsh'
          disabled: !!js process.platform !== 'win32'

        - id: tool-fs
          name: '@deepseek-ai/dsh-tool-fs'

        - id: tool-fs-search
          name: '@deepseek-ai/dsh-tool-fs-search'
          config:
            sampleOverCapGlobResults: false

        - id: tool-jobs
          name: '@deepseek-ai/dsh-tool-jobs'

        - id: skill-filesystem
          name: '@deepseek-ai/dsh-skill-filesystem'

        - id: tool-skill
          name: '@deepseek-ai/dsh-tool-skill'

        - id: tool-goal
          name: '@deepseek-ai/dsh-tool-goal'

        - id: planning
          name: cordis:group
          group: true
          isolate:
            planMode: true
          config:
            - id: plan-mode
              name: '@deepseek-ai/dsh-plan-mode'
              config:
                section: |-
                      You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Explore first with non-mutating reads. Do not edit or write files. When ready, call exit_plan_mode with the complete plan.

        - id: compaction
          name: cordis:group
          group: true
          isolate:
            compaction: true
            toolResultPruner: true
          config:
            - id: compaction-basic
              name: '@deepseek-ai/dsh-compaction-basic'

            - id: command-compact
              name: '@deepseek-ai/dsh-command-compact'

            - id: tool-result-pruner
              name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
              config:
                thresholdChars: 8192
                headChars: 4096
                tailChars: 1024

        - id: delegation
          name: cordis:group
          group: true
          isolate:
            workflowEngine: true
          config:
            - id: tool-subagent-control
              name: '@deepseek-ai/dsh-tool-subagent-control'

            - id: tool-subagent-list-agents
              name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

            - id: tool-subagent
              name: '@deepseek-ai/dsh-tool-subagent'
              config:
                provider: spawn
                toolName: subagent
                backgroundMode: continuable

            - id: tool-subagent-fork
              name: '@deepseek-ai/dsh-tool-subagent'
